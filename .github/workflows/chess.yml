name: Community chess
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/chess.yml']
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: community-chess
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install chess==1.11.2
      - run: python -P scripts/test_chess.py
  play:
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'chess: ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install chess==1.11.2
      - run: python -P scripts/chess.py
      - name: Save board
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md chess/state.json assets/chess-board.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update community chess board'
            git push
          fi
      - name: Close completed move
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER"
